# =============================================================================
# DRL Cartesian Path Planning — progress_box_over Reward, Fixed Box Obstacle
# =============================================================================
# FRAME-ONLY Cartesian DRL. No robot, no URDF, no IK/FK, no joints, no MoveIt.
#
# Scene layout (top-down):
#   Start  [0.35, -0.33, 0.10]  (right side)
#   Box    [0.145, -0.550, 0.08] size 0.1 x 0.1 x 0.1  (centre)
#   Target uniform random in [-0.135, -0.7150, 0.10] .. [0.195, -0.385, 0.10]
#
# Key features:
#   - fixed start: [0.35, -0.33, 0.10]
#   - random target: uniform sample in target_region (z always exactly 0.10)
#   - fixed box obstacle: visible, collidable — collision ends episode
#   - workspace z max = 0.30 (enough to pass over box top at z=0.13)
#   - progress_box_over reward mode
#
# Reward formula:
#   r = 50.0 * (d_prev - d_curr)         goal progress
#     - 0.01 * norm(action)               action effort penalty
#     - 5.0 * near_ratio   (if near box)  proximity penalty
#     + 2.0             (if xy_near_box AND above_box)  above-box bonus
#
# Terminal:
#   success        -> +100.0
#   collision      -> -100.0  (episode ends immediately)
#   workspace_viol -> -100.0
#   timeout        -> -10.0 * final_distance
#
# NOT USED:
#   detour_penalty, backtrack_penalty, smoothness_penalty,
#   path_efficiency_bonus, direction_penalty, path_length_penalty
# =============================================================================

project:
  name: DRL_Pathplanning_trainning
  robot_name: FRAME_ONLY
  unit: meter

# ---------------------------------------------------------------------------
# Start position — fixed
# ---------------------------------------------------------------------------
start:
  mode: fixed                     # 'fixed' | 'random'
  position: [0.35, -0.33, 0.10]  # used when mode is 'fixed'
  region_min: [-0.15, -0.75, 0.10]  # unused when mode=fixed
  region_max: [0.45, -0.05, 0.20]   # unused when mode=fixed

# ---------------------------------------------------------------------------
# Workspace / search region
# ---------------------------------------------------------------------------
workspace:
  name: search_region
  min: [-0.200, -0.800, 0.020]
  max: [0.500, 0.000, 0.300]    # z max = 0.30 > box top_z (0.13) allows going over

# ---------------------------------------------------------------------------
# Target region — random target, z always exactly 0.10
# ---------------------------------------------------------------------------
target_region:
  enabled: true
  random_target: true
  min: [-0.135, -0.7150, 0.10]
  max: [0.195, -0.385, 0.10]   # z max = 0.10 forces z to always be exactly 0.10
  fixed_target: [0.030, -0.535, 0.10]

# ---------------------------------------------------------------------------
# Fixed table (always visible, always collidable)
# ---------------------------------------------------------------------------
table:
  enabled: true
  name: table
  type: box
  center: [0.030, -0.550, -0.150]
  size: [0.330, 0.330, 0.360]
  color: [0.0, 0.0, 0.0, 1.0]
  collision: true

# ---------------------------------------------------------------------------
# Fixed box obstacle — THIS IS THE OBSTACLE TO AVOID
#   center: [0.145, -0.550, 0.080], size: [0.10, 0.10, 0.10]
#   box top_z = 0.080 + 0.050 = 0.130
#   workspace z_max = 0.30 > 0.130 — agent CAN go over the box
# ---------------------------------------------------------------------------
box:
  enabled: true
  name: small_obstacle
  type: box
  center: [0.1450, -0.550, 0.080]
  size: [0.100, 0.100, 0.100]
  color: [0.1, 0.1, 0.1, 1.0]
  collision: true
  safety_margin: 0.01

plane:
  enabled: true
  z: -0.330
  center: [0.150, -0.350, -0.330]
  size: [1.0, 1.0]
  color: [0.82, 0.82, 0.82, 0.35]
  collision: false

environment:
  mode: Default
  action_step: 0.01
  max_steps: 500
  target_threshold: 0.01

# ---------------------------------------------------------------------------
# Reward — progress_box_over mode
#
# Goal progress:
#   reward += c_goal * (d_prev - d_curr)
#
# Action effort penalty:
#   reward -= c_action * norm(action)
#
# Near-box proximity penalty:
#   if box_distance < near_box_penalty_threshold:
#       near_ratio = (threshold - box_distance) / threshold
#       reward -= near_box_penalty_coeff * near_ratio
#
# Above-box bonus (the KEY shaping signal):
#   if xy_near_box AND above_box:
#       reward += above_box_bonus
#
# Terminal rewards:
#   success        -> +success_bonus
#   collision      -> -collision_penalty
#   workspace_viol -> -workspace_penalty
#   timeout        -> -timeout_penalty_scale * final_distance
# ---------------------------------------------------------------------------
reward:
  reward_mode: progress_box_over

  # Goal progress
  c_goal: 50.0

  # Action effort penalty
  c_action: 0.01

  # Near-box proximity penalty
  near_box_penalty_threshold: 0.05
  near_box_penalty_coeff: 5.0

  # xy_near_box margin (margin added to box xy half-extent)
  xy_near_box_margin: 0.08

  # Above-box bonus — awarded when agent is above the box (xy near AND z > box_top_z + 0.02)
  above_box_bonus: 2.0

  # Terminal rewards
  success_bonus: 100.0          # +100 on reaching target
  collision_penalty: 100.0       # -100 on collision (box or table) — ends episode
  workspace_penalty: 100.0       # -100 on workspace violation
  timeout_penalty_scale: 10.0    # -10.0 * final_distance on timeout

  # All other reward components are zero (not used)
  progress_scale: 0.0
  distance_scale: 0.0
  step_penalty: 0.0
  path_length_scale: 0.0
  action_norm_scale: 0.0
  action_smoothness_scale: 0.0
  direction_misalignment_scale: 0.0
  path_efficiency_bonus_scale: 0.0
  detour_penalty_scale: 0.0
  backtrack_penalty_scale: 0.0

visualization:
  enabled: true
  gui: true
  hide_debug_ui: true
  show_workspace: true
  show_target_region: true
  show_start_frame: true
  show_target_frame: true
  show_agent_frame: true
  show_table: true
  show_box: true
  show_obstacle_safety_zone: false
  show_path: true
  show_ground_plane: true
  show_labels: true
  camera:
    distance: 1.2
    yaw: -60
    pitch: -35
    target: [0.150, -0.350, 0.170]
  style:
    frame_axis_length: 0.05
    agent_radius: 0.015
    path_line_width: 4

training:
  algorithm: TD3
  total_timesteps: 500000
  seed: 42
  device: auto
  vec_normalize: false   # DISABLED

evaluation:
  seed: 42
  num_episodes: 100
  export_waypoints: true
